# ============================================================================
# NEXUS Agent Pool Kubernetes Deployment
# ============================================================================
# Deploys agent pools with HPA, health checks, and rolling updates
# Compliance: FDA 21 CFR Part 11, EU GVP Module VI, GAMP 5
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: nexus-agents
  labels:
    app: nexus
    component: agent-pool
    compliance: fda-21cfr11

---
# ConfigMap for agent pool configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-pool-config
  namespace: nexus-agents
data:
  # Default pool configuration (overridable per agent)
  default-pool-config.yaml: |
    minReplicas: 2
    maxReplicas: 10
    targetCpuUtilization: 70
    healthCheckIntervalMs: 10000
    unhealthyThreshold: 3
    replacementTimeoutMs: 30000
    checkpointIntervalSpans: 5
    resumeFromCheckpoint: true
    startupTimeoutMs: 30000

  # Agent-specific overrides
  agent-configs.yaml: |
    agent-1-literature-duplicates:
      minReplicas: 2
      maxReplicas: 5
      targetCpuUtilization: 70
      maxConcurrent: 10

    agent-2-icsr-duplicates:
      minReplicas: 2
      maxReplicas: 5
      targetCpuUtilization: 70
      maxConcurrent: 5

    agent-3-followup-generator:
      minReplicas: 2
      maxReplicas: 10
      targetCpuUtilization: 60
      maxConcurrent: 20

    agent-4-screening:
      minReplicas: 3
      maxReplicas: 15
      targetCpuUtilization: 75
      maxConcurrent: 5

    agent-5-action-taken:
      minReplicas: 2
      maxReplicas: 10
      targetCpuUtilization: 60
      maxConcurrent: 20

    agent-6-dechallenge:
      minReplicas: 2
      maxReplicas: 10
      targetCpuUtilization: 60
      maxConcurrent: 20

    agent-7-rechallenge:
      minReplicas: 2
      maxReplicas: 10
      targetCpuUtilization: 60
      maxConcurrent: 20

    agent-8-medical-history:
      minReplicas: 2
      maxReplicas: 10
      targetCpuUtilization: 65
      maxConcurrent: 10

    agent-9-causality:
      minReplicas: 2
      maxReplicas: 5
      targetCpuUtilization: 70
      maxConcurrent: 3

---
# Service for agent pool (internal load balancing)
apiVersion: v1
kind: Service
metadata:
  name: agent-pool-service
  namespace: nexus-agents
  labels:
    app: nexus
    component: agent-pool
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: grpc
  selector:
    app: nexus
    component: agent-pool

---
# Agent Pool Deployment Template (one per agent type)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-pool-template
  namespace: nexus-agents
  labels:
    app: nexus
    component: agent-pool
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus
      component: agent-pool
  template:
    metadata:
      labels:
        app: nexus
        component: agent-pool
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-pool-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis-master:6379; do echo "Waiting for Redis..."; sleep 2; done; until nc -z postgres:5432; do echo "Waiting for PostgreSQL..."; sleep 2; done; until nc -z audit-ledger:8080; do echo "Waiting for Audit Ledger..."; sleep 2; done']
      containers:
      - name: agent-pool
        image: nexus/agent-pool:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        - containerPort: 9091
          name: metrics
        env:
        - name: AGENT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['agent-id']
        - name: TENANT_ID
          value: "default"
        - name: REDIS_URL
          value: "redis://redis-master:6379"
        - name: POSTGRES_URL
          value: "postgres://postgres:5432/nexus_audit"
        - name: AUDIT_LEDGER_URL
          value: "http://audit-ledger:8080"
        - name: MAX_RETRIES
          value: "3"
        - name: TIMEOUT_MS
          value: "30000"
        - name: DETERMINISTIC_SEED
          value: "42"
        - name: LOG_LEVEL
          value: "info"
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: agent-pool-config
      - name: tmp
        emptyDir: {}

---
# Horizontal Pod Autoscaler for Agent Pool
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-pool-hpa
  namespace: nexus-agents
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-pool-template
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: agent_queue_depth
      target:
        type: AverageValue
        averageValue: "10"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-pool-monitor
  namespace: nexus-agents
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: nexus
      component: agent-pool
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
  namespaceSelector:
    matchNames:
    - nexus-agents

---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-pool-pdb
  namespace: nexus-agents
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nexus
      component: agent-pool

---
# ServiceAccount for RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-pool-sa
  namespace: nexus-agents

---
# Role for agent pool permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-pool-role
  namespace: nexus-agents
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "patch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-pool-binding
  namespace: nexus-agents
subjects:
- kind: ServiceAccount
  name: agent-pool-sa
  namespace: nexus-agents
roleRef:
  kind: Role
  name: agent-pool-role
  apiGroup: rbac.authorization.k8s.io

---
# NetworkPolicy for agent isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-pool-network-policy
  namespace: nexus-agents
spec:
  podSelector:
    matchLabels:
      app: nexus
      component: agent-pool
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: nexus-system
    - podSelector:
        matchLabels:
          app: nexus
          component: api-gateway
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: nexus-data
    ports:
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 5432  # PostgreSQL
  - to:
    - namespaceSelector:
        matchLabels:
          name: nexus-audit
    ports:
    - protocol: TCP
      port: 8080  # Audit Ledger
  - to:
    - namespaceSelector:
        matchLabels:
          name: nexus-inference
    ports:
    - protocol: TCP
      port: 8080  # LLM Inference

---
# Example: Specific agent deployment (instantiated per agent)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-4-screening
  namespace: nexus-agents
  labels:
    app: nexus
    component: agent-pool
    agent-id: agent-4-screening
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexus
      component: agent-pool
      agent-id: agent-4-screening
  template:
    metadata:
      labels:
        app: nexus
        component: agent-pool
        agent-id: agent-4-screening
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: agent-pool-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: agent-pool
        image: nexus/agent-pool:v1.0.0
        env:
        - name: AGENT_ID
          value: "agent-4-screening"
        - name: MIN_REPLICAS
          value: "3"
        - name: MAX_REPLICAS
          value: "15"
        - name: TARGET_CPU_UTILIZATION
          value: "75"
        - name: MAX_CONCURRENT
          value: "5"
        # ... other env vars from template