# Encrypted secrets for GitOps - decryptable only by cluster controller
# Generated with: kubeseal --controller-name=sealed-secrets --controller-namespace=kube-system
# ============================================================================

# This file contains EXAMPLE sealed secrets templates.
# ACTUAL sealed secrets must be generated per environment using kubeseal.
# NEVER commit actual sealed secrets with real values to version control.

