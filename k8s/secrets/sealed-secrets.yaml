# ============================================================================
# mTLS Configuration (Istio)
# ============================================================================
# PeerAuthentication for STRICT mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: nexus-agents
spec:
  mtls:
    mode: STRICT

---
# DestinationRule for mTLS traffic
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: nexus-mtls
  namespace: nexus-agents
spec:
  host: "*.nexus-agents.svc.cluster.local"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1000
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 1000
        http2MaxRequests: 1000
    tls:
      mode: ISTIO_MUTUAL
      clientCertificate: /etc/certs/client.crt
      privateKey: /etc/certs/client.key
      caCertificates: /etc/certs/ca.crt

---
# AuthorizationPolicy for agent-to-agent communication
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: agent-to-agent
  namespace: nexus-agents
spec:
  selector:
    matchLabels:
      app: nexus
      component: agent-pool
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/nexus-agents/sa/agent-pool-sa"]
    - source:
        principals: ["cluster.local/ns/nexus-system/sa/api-gateway-sa"]
    - source:
        principals: ["cluster.local/ns/nexus-data/sa/redis-sa"]
    - source:
        principals: ["cluster.local/ns/nexus-audit/sa/audit-ledger-sa"]
    - source:
        principals: ["cluster.local/ns/nexus-inference/sa/inference-router-sa"]
  - to:
    - operation:
        methods: ["GET", "POST"]
        paths: ["/health", "/ready", "/execute", "/metrics"]
  - to:
    - operation:
        methods: ["GET", "POST"]
        ports: ["8080", "9090", "9091"]

---
# Sidecar for mTLS cert rotation
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtls-certs
  namespace: nexus-agents
data:
  ca.crt: |
    # CA certificate - managed by Istio
  server.crt: |
    # Server certificate - managed by Istio
  server.key: |
    # Server private key - managed by Istio

---
# Secrets for mTLS (managed by cert-manager + Istio)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nexus-mtls-cert
  namespace: nexus-agents
spec:
  secretName: nexus-mtls-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  subject:
    organizations:
      - Nexus Platform
  commonName: nexus-agents
  dnsNames:
    - "*.nexus-agents.svc.cluster.local"
    - "nexus-agents.svc.cluster.local"
  issuerRef:
    name: istio-ca
    kind: ClusterIssuer
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth

---
# NetworkPolicy for mTLS enforcement
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtls-only
  namespace: nexus-agents
spec:
  podSelector:
    matchLabels:
      app: nexus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: nexus-system
        - podSelector:
            matchLabels:
              app: nexus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: nexus-data
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              name: nexus-audit
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              name: nexus-inference
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              name: istio-system
      ports:
        - protocol: TCP
          port: 15012 # Istio mTLS cert rotation