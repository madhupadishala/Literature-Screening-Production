# ============================================================================
# VALIDATION SCRIPTS
# ============================================================================

validation:
  # Run on every CI build
  pre_deploy_checks:
    - "verify_model_hashes.sh"
    - "verify_grammar_hashes.sh"
    - "verify_database_schema.sh"
    - "npx tsc --noEmit"
    - "npm test"

  # Manual verification commands
  manual_verification:
    verify_llama_cpp:
      command: "./llama-server --version"
      expected_output_contains: "b4567"

    verify_qwen_model:
      command: "sha256sum models/qwen2.5-14b-instruct-q4_k_m.gguf"
      expected_hash: "a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b"

    verify_nllb_model:
      command: "sha256sum models/nllb-200-distilled-600M.onnx"
      expected_hash: "c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d"

    verify_fasttext_model:
      command: "sha256sum models/lid.176.bin"
      expected_hash: "d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e"

    verify_grammars:
      command: "sha256sum grammars/*.gbnf"
      expected: "Matches grammar.sha256 in lockfile"

