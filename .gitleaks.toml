title = "Literature-Screening-Production Gitleaks policy"
description = "Extends Gitleaks defaults while excluding generated/dependency artifacts that are never source-controlled release content."

[extend]
useDefault = true

[[allowlists]]
description = "Generated and dependency artifacts outside the governed source snapshot"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)benchmark-output/''',
  '''(^|/)coverage/''',
  '''(^|/)dist/''',
  '''(^|/)build/'''
]


[[allowlists]]
description = "Known non-secret deterministic idempotency fixture used by Nexus Sprint 3 verification"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''idempotencyKey:\\s*["']partner-msg-8842["']'''
]
