title = "Literature-Screening-Production Gitleaks policy"
description = "Extends Gitleaks defaults while excluding generated/dependency artifacts and one known synthetic verification fixture."

[extend]
useDefault = true

# Gitleaks 8.24.x uses the singular global allowlist table.
# Keep this deliberately narrow: generated artifacts plus one exact synthetic
# idempotency fixture that has never represented a credential.
[allowlist]
description = "Generated artifacts and exact non-secret verification fixture"
regexTarget = "secret"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)benchmark-output/''',
  '''(^|/)coverage/''',
  '''(^|/)dist/''',
  '''(^|/)build/'''
]
regexes = [
  '''^partner-msg-8842$'''
]
