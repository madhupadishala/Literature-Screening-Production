name: Nexus UAT Source Artifact

on:
  push:
    branches:
      - "release/nexus-integrated-rc1"

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package RC1 source
        run: tar --exclude=.git -czf nexus-uat-source.tgz .
      - name: Upload RC1 source
        uses: actions/upload-artifact@v4
        with:
          name: nexus-uat-source
          path: nexus-uat-source.tgz
          retention-days: 2
