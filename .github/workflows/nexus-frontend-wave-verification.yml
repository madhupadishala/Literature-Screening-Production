name: NEXUS Frontend Wave Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/nexus-frontend-wave-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-frontend-wave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Isolated frontend verification gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: npx tsc --noEmit
      - name: ESLint
        id: eslint
        continue-on-error: true
        run: npx eslint . --ext .ts,.tsx
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Unit and integration tests
        id: unit
        continue-on-error: true
        run: |
          if npm run | grep -Eq '^[[:space:]]+test([[:space:]]|$)'; then
            npm test -- --runInBand
          else
            echo "No npm test script; running repository node:test suites"
            node --test tests/auth/*.test.mjs tests/workflow/*.test.mjs
          fi
      - name: Install Playwright Chromium
        id: browser_install
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Build isolated browser fixtures
        id: fixtures
        if: steps.browser_install.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p .ui-state-harness .hits-test-harness
          npx --yes esbuild@0.25.11 tests/ui/ui-states-harness.tsx \
            --bundle --platform=browser --format=iife --jsx=automatic \
            --loader:.module.css=local-css \
            --outdir=.ui-state-harness --entry-names=bundle
          printf '<!doctype html><html><head><link rel="stylesheet" href="/bundle.css"></head><body><div id="root"></div><script src="/bundle.js"></script></body></html>' > .ui-state-harness/index.html
          npx --yes esbuild@0.25.11 tests/ui/hits-harness.tsx \
            --bundle --platform=browser --format=iife --jsx=automatic \
            --loader:.module.css=local-css --alias:@=. \
            --define:process.env.NODE_ENV='"development"' \
            --define:process.env.NEXT_PUBLIC_NEXUS_HITS_FIXTURES='"false"' \
            --outdir=.hits-test-harness --entry-names=bundle
          printf '<!doctype html><html><head><link rel="stylesheet" href="/bundle.css"></head><body><div id="root"></div><script src="/bundle.js"></script></body></html>' > .hits-test-harness/index.html
      - name: Browser regression
        id: browser
        if: steps.browser_install.outcome == 'success' && steps.fixtures.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/serve-ui-states.mjs >/tmp/ui-state-harness.log 2>&1 &
          node scripts/serve-hits-harness.mjs >/tmp/hits-harness.log 2>&1 &
          for port in 3107 3108; do
            ready=0
            for attempt in $(seq 1 40); do
              if curl -sf "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/ui-state-harness.log /tmp/hits-harness.log
              exit 1
            fi
          done
          npx playwright test tests/ui/ui-states.spec.ts tests/ui/hits-api.spec.ts
      - name: Gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NEXUS frontend verification"
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| TypeScript | ${{ steps.typescript.outcome }} |"
            echo "| ESLint | ${{ steps.eslint.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Unit/integration | ${{ steps.unit.outcome }} |"
            echo "| Browser install | ${{ steps.browser_install.outcome }} |"
            echo "| Browser fixtures | ${{ steps.fixtures.outcome }} |"
            echo "| Playwright harness regression | ${{ steps.browser.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any required gate failed
        if: always()
        env:
          TSC: ${{ steps.typescript.outcome }}
          LINT: ${{ steps.eslint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          INSTALL: ${{ steps.browser_install.outcome }}
          FIXTURES: ${{ steps.fixtures.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          for status in "$TSC" "$LINT" "$BUILD" "$UNIT" "$INSTALL" "$FIXTURES" "$BROWSER"; do
            if [ "$status" != "success" ]; then
              echo "Unqualified gate: $status"
              exit 1
            fi
          done
