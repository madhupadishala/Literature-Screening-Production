name: NEXUS Frontend Wave Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/nexus-frontend-wave-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-frontend-wave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Isolated frontend verification gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: npx tsc --noEmit
      - name: ESLint
        id: eslint
        continue-on-error: true
        run: npx eslint . --ext .ts,.tsx
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Unit and integration tests
        id: unit
        continue-on-error: true
        run: |
          if npm run | grep -Eq '^[[:space:]]+test([[:space:]]|$)'; then
            npm test -- --runInBand
          else
            echo "No npm test script; running repository node:test suites"
            node --test tests/auth/*.test.mjs tests/workflow/*.test.mjs
          fi
      - name: Install Playwright Chromium
        id: browser_install
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        id: browser
        if: steps.browser_install.outcome == 'success'
        continue-on-error: true
        run: npx playwright test
      - name: Gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NEXUS frontend verification"
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| TypeScript | ${{ steps.typescript.outcome }} |"
            echo "| ESLint | ${{ steps.eslint.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Unit/integration | ${{ steps.unit.outcome }} |"
            echo "| Browser install | ${{ steps.browser_install.outcome }} |"
            echo "| Playwright | ${{ steps.browser.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any required gate failed
        if: always()
        env:
          TSC: ${{ steps.typescript.outcome }}
          LINT: ${{ steps.eslint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          INSTALL: ${{ steps.browser_install.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          for status in "$TSC" "$LINT" "$BUILD" "$UNIT" "$INSTALL" "$BROWSER"; do
            if [ "$status" != "success" ]; then
              echo "Unqualified gate: $status"
              exit 1
            fi
          done
