name: NEXUS UI primitives formatting gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/nexus-unified-ui-primitives-20261028
    paths:
      - ".github/workflows/ui-primitives-format.yml"

permissions:
  contents: write

jobs:
  format-primitives:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Prettier-format all shared UI components
        run: |
          npx --yes prettier@3.6.2 --write "components/ui/**/*.{tsx,css}"
          npx --yes prettier@3.6.2 --check "components/ui/**/*.{tsx,css}"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Push formatted components after all checks
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/ui
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style(ui): Prettier-format shared primitives"
          git push origin HEAD:feat/nexus-unified-ui-primitives-20261028
