name: NEXUS styled-jsx inventory
on:
  push:
    branches:
      - feat/nexus-unified-ui-primitives-20261028
    paths:
      - "frontend/scripts/report-styled-jsx.mjs"
      - ".github/workflows/ui-styled-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: node scripts/report-styled-jsx.mjs
