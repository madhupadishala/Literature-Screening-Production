name: Dependency remediation (controlled)
on:
  push:
    branches:
      - fix/nexus-frontend-dependency-security-20261102
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed outside approved branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/nexus-frontend-dependency-security-20261102" || exit 1
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate dependencies and lockfile through npm
        working-directory: frontend
        run: |
          npm install next@16.4.3 zod@4.6.7 --save-exact --package-lock-only --ignore-scripts
          npm pkg set 'overrides.@qdrant/js-client-rest.undici=6.29.1' 'overrides.cheerio.undici=7.30.1'
          npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Capture audit JSON and complete dependency tree
        id: audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_result=$?
          npm ls next undici zod --all > dependency-tree.txt 2>&1
          ls_result=$?
          echo "audit_result=$audit_result" >> "$GITHUB_OUTPUT"
          echo "npm audit exit=$audit_result; npm ls exit=$ls_result"
          exit 0
      - name: Upload audit and dependency tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-evidence-${{ github.sha }}
          path: |
            frontend/npm-audit.json
            frontend/dependency-tree.txt
          if-no-files-found: error
          retention-days: 30
      - name: Enforce security threshold
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Commit npm-generated manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): patch Next.js Zod and scoped Undici overrides via npm"
            git push origin HEAD:refs/heads/fix/nexus-frontend-dependency-security-20261102
          fi
