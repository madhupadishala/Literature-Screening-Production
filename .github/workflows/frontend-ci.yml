name: ClinixAI Frontend Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce architecture dependency gate
        run: |
          npm install --no-save --package-lock=false --ignore-scripts dependency-cruiser@18.4.0
          ./node_modules/.bin/depcruise --config .dependency-cruiser.cjs app lib scripts

      - name: Enforce dependency security gate
        run: npm run security:audit

      - name: Run lint when configured
        shell: bash
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No lint script is currently configured."
          fi

      - name: Verify pharmaceutical product intelligence
        run: npm run pharmaceutical:verify

      - name: Verify PV decision architecture
        run: npm run pv:verify

      - name: Verify governed Screening and Product/MAH logic
        run: npm run screening:verify

      - name: Verify governed Screening-to-Intake handoff
        run: npm run intake:verify

      - name: Verify scheduled production literature search governance
        run: npm run scheduler:verify

      - name: Verify Nexus Sprint 1 authorization foundation
        run: npm run nexus:sprint1:verify

      - name: Verify Nexus Sprint 2 common safety backbone
        run: npm run nexus:sprint2:verify

      - name: Verify Nexus Sprint 3 canonical intake sources
        run: npm run nexus:sprint3:verify

      - name: Verify Nexus Sprint 4 intake review and extraction
        run: npm run nexus:sprint4:verify

      - name: Verify Nexus Sprint 5 ICSR validity and triage
        run: npm run nexus:sprint5:verify

      - name: Verify Nexus Sprint 6 duplicate and follow-up
        run: npm run nexus:sprint6:verify

      - name: Verify Nexus Sprint 7 intake disposition
        run: npm run nexus:sprint7:verify

      - name: Verify Nexus Sprint 8 L2A case processing
        run: npm run nexus:sprint8:verify

      - name: Verify Nexus Sprint 9 QC medical review and finalization
        run: npm run nexus:sprint9:verify

      - name: Verify Nexus Sprint 10 evidence export and release hardening
        run: npm run nexus:sprint10:verify

      - name: Verify Nexus tenant integrity hardening
        run: npm run nexus:tenant-integrity:verify

      - name: Verify Nexus identity-first workspace architecture
        run: npm run nexus:identity-workspace:verify

      - name: Verify Nexus security boundary negative cases
        run: npm run nexus:security-boundaries:verify

      - name: Verify controlled regulatory knowledge foundation
        run: npm run regulatory:knowledge:verify

      - name: Verify cleanup Sprint 4 Literature reconciliation
        run: npm run cleanup:sprint4:verify

      - name: Verify cleanup Sprint 5 Intake reconciliation
        run: npm run cleanup:sprint5:verify

      - name: Verify cleanup Sprint 6 Case Processing reconciliation
        run: npm run cleanup:sprint6:verify

      - name: Verify cleanup Sprint 7 Submissions foundation
        run: npm run cleanup:sprint7:verify

      - name: Verify cleanup Sprint 8 Signal Management foundation
        run: npm run cleanup:sprint8:verify

      - name: Build production application
        run: npm run build

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-build-diagnostics
          path: |
            frontend/.next
            frontend/npm-debug.log
          if-no-files-found: ignore
          retention-days: 7