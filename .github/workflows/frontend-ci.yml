name: ClinixAI Frontend Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clinixai
          POSTGRES_PASSWORD: clinixai
          POSTGRES_DB: clinixai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinixai -d clinixai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clinixai:clinixai@localhost:5432/clinixai_test
      DATABASE_SSL_MODE: disable
      ALLOW_DEMO_PRINCIPAL: "false"
      SESSION_SECRET: qualification-session-secret-with-at-least-32-bytes

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run lint when configured
        shell: bash
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No lint script is currently configured."
          fi

      - name: Verify cross-tenant boundaries
        run: npm run validate:tenant-boundaries

      - name: Verify database-backed HTTP boundaries
        run: npm run validate:database-http-boundaries

      - name: Build production application
        run: npm run build

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: |
            frontend/.next
            frontend/npm-debug.log
          if-no-files-found: ignore
          retention-days: 7