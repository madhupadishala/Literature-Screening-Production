name: Nexus canonical agent integration checks
on:
  push:
    branches:
      - integration/nexus-agent-five-steps-20261011
  pull_request:
    paths:
      - "backend/shared_agents/**"
      - "backend/services/pv_agents/specialist_graph.py"
      - "tests/test_canonical_shared_agents.py"
      - ".github/workflows/nexus-canonical-agents.yml"
  workflow_dispatch:
jobs:
  canonical-and-specialist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p "test_canonical_shared_agents.py" -v
      - run: python -m compileall -q backend/shared_agents/vendor backend/shared_agents/registry.py backend/services/pv_agents/specialist_graph.py backend/agents/drug_role/nexus_agent.py
