name: Nexus canonical agent source checks

on:
  pull_request:
    paths:
      - "backend/shared_agents/**"
      - "tests/test_canonical_shared_agents.py"
      - ".github/workflows/nexus-canonical-agents.yml"
  workflow_dispatch:

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify 13 sources and parse Python modules
        run: python -m unittest discover -s tests -p "test_canonical_shared_agents.py" -v
