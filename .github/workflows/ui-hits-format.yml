name: NEXUS Hits formatting and line-budget gate
on:
  push:
    branches:
      - feat/nexus-unified-ui-primitives-20261028
    paths:
      - ".github/workflows/ui-hits-format.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hits-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Format Hits source
        run: |
          npx --yes prettier@3.6.2 --print-width 120 --write "components/nexus-hits-v2/{HitsWorkspace,DuplicateCheck,ManualSearch,Queue,MyAssignments}.tsx" "components/nexus-hits-v2/hooks/{useHits,hits-utils,hits-actions,hits-review-actions}.ts"
          npx --yes prettier@3.6.2 --print-width 120 --check "components/nexus-hits-v2/{HitsWorkspace,DuplicateCheck,ManualSearch,Queue,MyAssignments}.tsx" "components/nexus-hits-v2/hooks/useHits.ts"
      - name: Check source line budgets
        run: |
          failures=0
          for file in components/nexus-hits-v2/{HitsWorkspace,DuplicateCheck,ManualSearch,Queue,MyAssignments}.tsx components/nexus-hits-v2/hooks/{useHits,hits-utils}.ts; do
            count=$(wc -l < "$file")
            echo "$file: $count lines"
            if test "$count" -ge 300; then echo "File exceeds regulated UI line budget"; failures=1; fi
          done
          test "$failures" -eq 0
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Commit and push validated format
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/nexus-hits-v2/
          git diff --cached --quiet && exit 0
          git commit -m "style(hits): format split workspaces"
          git push origin HEAD:feat/nexus-unified-ui-primitives-20261028
