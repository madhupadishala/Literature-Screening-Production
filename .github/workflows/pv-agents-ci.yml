name: Shared PV Agent Quality Gate
on:
  push:
    branches: [main, develop, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: pv-agents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agents.txt -r requirements-agents-test.txt
      - run: python -c "import chromadb; from backend.agents.drug_role.nexus_agent import NexusDrugRoleAgent; from backend.engines.causality.nexus_kb_adapter import NexusCausalityKnowledgeAdapter"
      - run: python -m pytest tests/test_drug_role_agent.py tests/test_shared_pv_agents.py -q
  typed-agent-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --import tsx --test scripts/shared-pv-agent-client.test.ts
      - run: npx tsc --noEmit
