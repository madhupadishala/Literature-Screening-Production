name: Shared PV Agent Quality Gate
on:
  push:
    branches: [main, develop, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: pv-agents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agents.txt -r requirements-agents-test.txt
      - name: Exact Render install and boot smoke
        run: |
          python -m pip install -r backend/services/pv_agents/requirements-render.txt
          PORT=18765 gunicorn backend.services.pv_agents.render_wsgi:application --bind 0.0.0.0:18765 --workers 1 --timeout 120 > /tmp/nexus-render-boot.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/healthz -o /tmp/nexus-health.json; then break; fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/nexus-health.json"))["service"] == "nexus-pv-agents"'
          test "$(curl -s -o /tmp/nexus-ready.json -w '%{http_code}' http://127.0.0.1:18765/readyz)" = "503"
          kill -0 "$pid"
      - run: python -c "import chromadb; from backend.agents.drug_role.nexus_agent import NexusDrugRoleAgent; from backend.engines.causality.nexus_kb_adapter import NexusCausalityKnowledgeAdapter"
      - run: python -m unittest Agentic_AI.shared.tests.test_workflow_context Agentic_AI.shared.tests.test_execution_dispatcher Agentic_AI.shared.tests.test_specialist_import_contracts Agentic_AI.shared.tests.test_recovered_engine_execution Agentic_AI.shared.tests.test_duplicate_candidate_scope Agentic_AI.shared.tests.test_duplicate_bindings Agentic_AI.shared.tests.test_additional_bindings Agentic_AI.shared.tests.test_v25_binding_contracts Agentic_AI.shared.tests.test_service_bindings Agentic_AI.shared.tests.test_dynamic_knowledge_folders Agentic_AI.shared.tests.test_native_pipeline_bindings Agentic_AI.shared.tests.test_router_dynamic_knowledge Agentic_AI.shared.tests.test_grounded_specialists Agentic_AI.shared.tests.test_render_runtime_contract Agentic_AI.shared.tests.test_staging_specialist_readiness Agentic_AI.shared.tests.test_batch1_real_execution Agentic_AI.shared.tests.test_approved_json_provider Agentic_AI.shared.tests.test_native_runtime_batch Agentic_AI.shared.tests.test_native_event_engine
      - run: python -m pytest tests/test_drug_role_agent.py tests/test_shared_pv_agents.py tests/test_specialist_workers.py tests/test_drug_role_benchmark.py -q
  typed-agent-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../requirements-agents.txt -r ../requirements-agents-test.txt
      - run: npm ci
      - run: node --import tsx --test scripts/shared-pv-agent-client.test.ts scripts/pv-specialist-http.test.ts scripts/next-root-glob.test.cjs
      - run: npx tsc --noEmit
